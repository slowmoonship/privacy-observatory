name: Daily data and Pages build
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: privacy-observatory-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.8'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Test data pipeline
        run: python -m unittest discover -s tests -v
      - name: Update independent sources
        id: update
        shell: bash
        run: |
          set +e
          python scripts/update_data.py
          result=$?
          set -e
          cat data-status.json
          if [ "$result" -eq 0 ] || [ "$result" -eq 2 ]; then
            echo "result=$result" >> "$GITHUB_OUTPUT"
          else
            echo 'No usable publication: retained snapshots are missing, invalid, stale, or every source failed.' >&2
            exit 1
          fi
      - name: Verify snapshots and build
        run: |
          python scripts/check_data.py
          npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      - name: Persist validated data
        shell: bash
        run: |
          git add public/data/market.json public/data/activity.json public/data/pools.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh verified snapshots'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Upload data status
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: data-status
          path: data-status.json
          if-no-files-found: warn
      - name: Upload Pages artifact (not deployed)
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist
# Deployment intentionally absent until separately authorized; see docs/pages-release.md.
