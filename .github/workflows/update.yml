name: Daily data and Pages build
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      expected_snapshot_commit:
        description: 'Optional checkout commit assertion for cross-run snapshot verification'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: privacy-observatory-update
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1.0-public-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: python -m pip install -r scripts/requirements-datasets.txt
      - run: npm ci
      - name: Verify checked-out public history and persisted snapshot
        env:
          EXPECTED_SNAPSHOT_COMMIT: ${{ inputs.expected_snapshot_commit }}
        run: |
          python scripts/check_public_git.py
          checked_out=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SNAPSHOT_COMMIT" ]; then
            test "$checked_out" = "$EXPECTED_SNAPSHOT_COMMIT"
          fi
          echo "runner_checkout=$checked_out"
          echo "checkout_dataset_tree=$(git rev-parse HEAD:datasets)"
      - name: Test data pipeline
        run: |
          python -m unittest discover -s tests -v
          python tests/phase4_refresh.py
          node --experimental-strip-types --test tests/zcash-snapshot.mjs
      - name: Refresh full research data and bounded economics together
        run: |
          python scripts/refresh_datasets.py --output "$RUNNER_TEMP/verified-inputs"
          for dataset in privacy_market_daily privacy_network_daily; do
            cp "$RUNNER_TEMP/verified-inputs/$dataset/"* "datasets/$dataset/"
          done
          cp "$RUNNER_TEMP/verified-inputs/network-economics.json" datasets/network-economics.json
      - name: Verify and build an atomic Pages artifact
        run: |
          npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
          python tests/phase3_public.py
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/site-sha256.txt"
          echo "artifact_file_count=$(wc -l < "$RUNNER_TEMP/site-sha256.txt")"
          echo "artifact_contents_sha256=$(sha256sum "$RUNNER_TEMP/site-sha256.txt" | cut -d ' ' -f1)"
      - name: Persist validated data
        run: |
          git add datasets/privacy_market_daily datasets/privacy_network_daily datasets/network-economics.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh verified research and economics snapshots'
            python scripts/check_public_git.py
            git push origin "HEAD:$GITHUB_REF"
          fi
          verified=$(git rev-parse HEAD)
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$verified"
          echo "verified_snapshot_commit=$verified"
          echo "verified_dataset_tree=$(git rev-parse HEAD:datasets)"
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: update
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
